[workspace]
members = ["crates/edss-*"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
edss-gui = { path = "crates/edss-gui" }
edss-journals = { path = "crates/edss-journals" }
edss-rpc = {path = "crates/edss-rpc" }
edss-runtime = { path = "crates/edss-runtime" }
edss-sessions = { path = "crates/edss-sessions" }
tokio = { version = "1.49", features = ["full"] }
tracing = { version = "0.1.44" }
tracing-subscriber = "0.3.22"
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = {version = "1.0.102"}
